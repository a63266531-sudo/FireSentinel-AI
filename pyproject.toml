[project]
name = "ai-fire-risk-analyzer"
version = "1.0.0"
description = "FireSentinel AI: wildfire observation analytics and next-week fire-occurrence risk (research prototype)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "streamlit>=1.33", "pandas>=2.1", "numpy>=1.26", "scikit-learn>=1.3", "scipy>=1.11",
  "plotly>=5.18,<7", "requests>=2.31", "joblib>=1.3", "reportlab>=4.0", "matplotlib>=3.8", "markdown>=3.5",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
